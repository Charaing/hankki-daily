<!doctype html>
<html lang="ko" data-type="software" data-radius="round" data-motion>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="page-type" content="software"><meta name="site-kind" content="software">
  <title>한끼 — 매일 쌓이는 나의 식단 기록</title>
  <meta name="description" content="먹은 음식을 찾고, 그램과 인분으로 간편하게 기록하세요. 식약처 공개 식품 데이터, 하루 칼로리와 영양소, 나만의 식단 리포트까지.">
  <meta property="og:title" content="한끼 — 매일 쌓이는 나의 식단 기록">
  <meta property="og:description" content="오늘 먹은 한 끼, 가볍게 남겨요. 음식 검색부터 칼로리 계산까지 한곳에서.">
  <meta property="og:type" content="website"><meta property="og:image" content="https://charaing.github.io/hankki-daily/share.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://charaing.github.io/hankki-daily/">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" href="./assets/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./assets/motion/motion.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <aside class="sidebar" aria-label="주 메뉴">
    <a class="brand" href="./" aria-label="한끼 홈"><img src="./assets/favicon.svg" width="36" height="36" alt=""><span>한끼<span class="brand-dot">.</span></span></a>
    <p class="nav-label">나를 위한 작은 습관</p>
    <nav class="desktop-nav" aria-label="앱 메뉴">
      <button data-action="view" data-view="today" class="nav-item active"><span data-icon="journal"></span>오늘 기록<span class="nav-dot"></span></button>
      <button data-action="view" data-view="report" class="nav-item"><span data-icon="chart"></span>기록 리포트</button>
      <button data-action="view" data-view="library" class="nav-item"><span data-icon="heart"></span>음식 보관함</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="local-note"><span data-icon="shield"></span><div>내 기록은 내 기기에<span>로그인 없이, 자동 저장돼요</span></div></div>
      <button class="profile" data-action="settings"><span class="profile-icon" data-icon="user"></span><span>나의 식단<small>목표와 데이터 관리</small></span><span data-icon="chevron-right"></span></button>
    </div>
  </aside>
  <div class="app-shell">
    <header class="mobile-header"><a class="brand" href="./"><img src="./assets/favicon.svg" width="30" height="30" alt=""><span>한끼<span class="brand-dot">.</span></span></a><button class="icon-button" data-action="settings" aria-label="설정 열기"><span data-icon="settings"></span></button></header>
    <main id="main" tabindex="-1">
      <div class="page-header" data-enter>
        <div><p class="eyebrow" id="eyebrow">매일 조금씩, 나를 챙기는 시간</p><h1 id="page-title">오늘의 식단</h1></div>
        <div class="header-actions"><span class="saved-status"><span></span>기기에 자동 저장</span><button class="btn btn--secondary secondary-button desktop-settings" data-action="settings"><span data-icon="settings"></span>목표 설정</button></div>
      </div>
      <div class="date-toolbar" id="date-toolbar">
        <div class="date-navigation"><button class="icon-button" data-action="date-prev" aria-label="이전 날짜"><span data-icon="chevron-left"></span></button><div class="date-label"><button data-action="date-picker" aria-label="기록 날짜 선택"><span id="date-title"></span><span data-icon="chevron-down"></span></button><input id="date-input" type="date" min="1900-01-01" max="2200-12-31" aria-label="기록 날짜" tabindex="-1"></div><button class="icon-button" data-action="date-next" aria-label="다음 날짜"><span data-icon="chevron-right"></span></button><button class="today-button" data-action="today">오늘</button></div>
        <span class="date-caption" id="date-caption">오늘도 한 끼씩 기록해요</span>
      </div>
      <div id="page-content"></div>
      <footer class="app-footer"><span>한끼 · 매일의 기록이 나를 만들어요</span><button data-action="sources">식품 데이터 출처 및 안내<span data-icon="arrow-up-right"></span></button></footer>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="모바일 메뉴"><button data-action="view" data-view="today" class="active"><span data-icon="journal"></span><span>오늘 기록</span></button><button data-action="view" data-view="report"><span data-icon="chart"></span><span>리포트</span></button><button data-action="view" data-view="library"><span data-icon="heart"></span><span>보관함</span></button></nav>

  <dialog id="food-dialog" class="food-dialog" aria-labelledby="food-dialog-title">
    <header class="dialog-header"><div><span class="eyebrow">한 끼를 남기는 가장 쉬운 방법</span><h2 id="food-dialog-title">무엇을 드셨나요?</h2></div><button class="icon-button" data-action="close-food" aria-label="음식 검색 닫기"><span data-icon="x"></span></button></header>
    <div class="food-dialog-layout">
      <section class="search-panel" aria-label="음식 검색">
        <label class="search-label" for="food-search">음식 이름</label><div class="search-box"><span data-icon="search"></span><input id="food-search" type="search" autocomplete="off" placeholder="김치찌개, 닭가슴살, 아메리카노"><kbd>/</kbd></div>
        <div class="search-tabs" role="tablist" aria-label="검색 종류"><button role="tab" aria-selected="true" data-action="search-tab" data-tab="all">전체 음식</button><button role="tab" aria-selected="false" data-action="search-tab" data-tab="recent">최근 기록</button><button role="tab" aria-selected="false" data-action="search-tab" data-tab="favorite">즐겨찾기</button><button role="tab" aria-selected="false" data-action="search-tab" data-tab="custom">직접 등록</button></div>
        <div id="search-filters" class="filter-row"></div>
        <div class="search-result-header"><span id="result-label">자주 찾는 음식</span><span id="db-status" role="status">공개 식품 DB 연결 중</span></div>
        <div id="food-results" class="food-results" aria-label="음식 검색 결과"></div>
        <div class="search-bottom"><button class="text-button" data-action="custom-food"><span data-icon="plus"></span>음식 직접 등록</button><button class="text-button" id="online-search" data-action="online-search"><span data-icon="globe"></span>해외 식품 검색</button></div>
      </section>
      <section class="food-detail" id="food-detail" aria-label="섭취량 선택"></section>
    </div>
  </dialog>

  <dialog id="settings-dialog" class="small-dialog" aria-labelledby="settings-title"><header class="dialog-header"><div><span class="eyebrow">나에게 맞게, 조금씩</span><h2 id="settings-title">목표와 데이터 관리</h2></div><button class="icon-button" data-action="close-settings" aria-label="설정 닫기"><span data-icon="x"></span></button></header><div class="small-dialog-body" id="settings-body"></div></dialog>
  <dialog id="custom-dialog" class="small-dialog" aria-labelledby="custom-title"><header class="dialog-header"><div><span class="eyebrow">영양정보를 보고 채워 주세요</span><h2 id="custom-title">나만의 음식 등록</h2></div><button class="icon-button" data-action="close-custom" aria-label="직접 등록 닫기"><span data-icon="x"></span></button></header><div class="small-dialog-body" id="custom-body"></div></dialog>
  <dialog id="info-dialog" class="small-dialog" aria-labelledby="info-title"><header class="dialog-header"><h2 id="info-title">식품 데이터 안내</h2><button class="icon-button" data-action="close-info" aria-label="안내 닫기"><span data-icon="x"></span></button></header><div id="info-body" class="small-dialog-body info-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><p class="noscript">식단을 기록하려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./assets/motion/motion.js"></script>
</body>
</html>
